    <title>Grainery</title>
    <!--
      Installable web app ("Add to Home Screen"). Every path here is RELATIVE, not "/manifest.json" as Expo's
      PWA guide shows: the site is served from the GitHub Pages base path /grainery/, where a root-absolute

      longer need one to install, and an offline cache would pin visitors to stale app/data after deploys.
    -->
    <meta name="description" content="Film photography from across Bluesky, curated by hand." />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Grainery" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
